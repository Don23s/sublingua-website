<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden – SubLingua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; background: #0a1628; color: #fff;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 40px;
    }
    .code { font-size: 6rem; font-weight: 700; color: #0d9488; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.6); margin-bottom: 32px; }
    a {
      display: inline-block; background: #0d9488; color: #fff;
      padding: 12px 28px; border-radius: 8px; font-weight: 600;
      text-decoration: none; transition: background 0.2s;
    }
    a:hover { background: #14b8a6; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Seite nicht gefunden</h1>
    <p>Diese Seite existiert nicht oder wurde verschoben.</p>
    <a href="/">Zurück zur Startseite</a>
  </div>
</body>
</html>
